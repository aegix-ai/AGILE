version: '3.8'

services:
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile
    image: agile-sandbox:latest
    container_name: agile-sandbox
    hostname: agile-sandbox
    privileged: true
    stdin_open: true
    tty: true
    volumes:
      - ../:/home/sandbox/AGILE
      - ./workspace:/home/sandbox/workspace
      - ./memory:/home/sandbox/memory
      - ./reports:/home/sandbox/reports
      - /var/run/docker.sock:/var/run/docker.sock
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    cgroup: host
    security_opt:
      - seccomp:unconfined
    cap_add:
      - ALL
    networks:
      - sandbox-net

networks:
  sandbox-net:
    driver: bridge
